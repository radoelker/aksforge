name: CD — Frontend (Staging)

on:
  push:
    branches: [staging]
    paths:
      - 'expensy_frontend/**'
      - '.github/workflows/cd-staging-frontend.yml'

permissions:
  id-token: write
  contents: write

env:
  ACR:   acr2poiclyh4krxy.azurecr.io
  IMAGE: acr2poiclyh4krxy.azurecr.io/expensy-frontend
  # NEXT_PUBLIC_API_URL is baked into the Next.js bundle at build time
  NEXT_PUBLIC_API_URL: https://backend.staging.20.85.194.20.sslip.io

jobs:
  build-and-deploy:
    name: Build, Scan & Deploy to Staging
    runs-on: ubuntu-24.04-arm64
    defaults:
      run:
        working-directory: expensy_frontend

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── CI — lint + test ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: expensy_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # ── Image metadata ───────────────────────────────────────────────────
      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "sha_tag=${{ env.IMAGE }}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "latest_tag=${{ env.IMAGE }}:staging-latest" >> $GITHUB_OUTPUT

      # ── Docker buildx setup ──────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Azure + ACR login ────────────────────────────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      #  az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #  az acr login --name acr2poiclyh4krxy
      # ============================================================
      # Login to Azure Container Registry
      # ============================================================
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: acr2poiclyh4krxy.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── Trivy scan ───────────────────────────────────────────────────────
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v6
        with:
          context:    ./expensy_frontend
          platforms:  linux/amd64
          load:       true
          tags:       ${{ env.IMAGE }}:scan-target
          build-args: NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      ${{ env.IMAGE }}:scan-target
          format:         table
          exit-code:      0           # ← changed from 1, report only
          severity:       CRITICAL    # warn on HIGH, fail on CRITICAL
          ignore-unfixed: true

      # ── Build & push multi-arch to ACR ───────────────────────────────────
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context:    ./expensy_frontend
          platforms:  linux/amd64,linux/arm64
          push:       true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          build-args: NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Update staging kustomization ─────────────────────────────────────
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag in staging overlay
        working-directory: k8s/apps/frontend/staging
        run: |
          kustomize edit set image \
            ${{ env.IMAGE }}=${{ steps.tags.outputs.sha_tag }}

      - name: Commit and push updated kustomization
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Änderungen für den Commit vormerken
          git add k8s/apps/frontend/staging/kustomization.yaml
          
          # 2. Nur commiten, wenn es tatsächlich Änderungen gibt
          git diff-index --quiet HEAD || git commit -m "chore: frontend update kustomization [skip ci]"
          
          # 3. Änderungen pushen
          git push origin staging

      # ── Step 15: k6 load test ─────────────────────────────────────────────
      # Uncomment after Step 15 deploys the k6 Job manifest.
      #
      # - name: Run k6 load test
      #   run: |
      #     kubectl apply -f k8s/apps/frontend/staging/k6-job.yaml
      #     kubectl wait --for=condition=complete job/k6-load-test -n staging --timeout=900s
      # ─────────────────────────────────────────────────────────────────────
