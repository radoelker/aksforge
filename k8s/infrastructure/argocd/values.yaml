# ArgoCD — Helm values
# Chart: argo/argo-cd
# Pinned version: 7.8.0
#
# Runs on fixed node pool. GitOps controller must not land on spot.
# Admin password: fetched from Key Vault by ESO at runtime (Step 3).
# After install, retrieve initial admin password with:
#   kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d

global:
  nodeSelector:
    kubernetes.azure.com/agentpool: agentpool
  tolerations: []

server:
  replicas: 2

  # Expose ArgoCD UI via NGINX Ingress (Step 6).
  # Set ingress.enabled=true and configure hostname after ingress controller is up.
  ingress:
    enabled: false   # enabled in Step 6

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Disable --insecure only if TLS is terminated at the ingress controller.
  extraArgs:
    - --insecure

applicationSet:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Disable built-in Dex (no SSO configured yet).
dex:
  enabled: false

configs:
  params:
    # Allow ArgoCD to manage resources in all namespaces (needed for App-of-Apps pattern).
    application.namespaces: "*"
