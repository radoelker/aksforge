apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // ----------------------------------------------------------------
    // Log collection — all pods, all namespaces → Loki
    // ----------------------------------------------------------------
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Keep only running pods
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed|Unknown"
        action        = "drop"
      }

      // Standard Loki labels
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.gateway.receiver]
    }

    // ----------------------------------------------------------------
    // Log shipping → Loki gateway
    // ----------------------------------------------------------------
    loki.write "gateway" {
      endpoint {
        url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
      }
    }

    // ----------------------------------------------------------------
    // Metric forwarding — Alloy self-metrics → Prometheus
    // ----------------------------------------------------------------
    // prometheus.exporter.self "alloy" {}

    // prometheus.scrape "alloy_self" {
    //   targets    = prometheus.exporter.self.alloy.targets
    //   forward_to = [prometheus.remote_write.prometheus.receiver]
    // }

    // prometheus.remote_write "prometheus" {
    //  endpoint {
    //    url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
    //  }
    // }