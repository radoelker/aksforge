# kube-prometheus-stack — Helm values
# Chart: prometheus-community/kube-prometheus-stack
# Pinned version: 69.2.0
# Namespace: monitoring
#
# All stateful components (Prometheus, Alertmanager) are pinned to the
# fixed node pool to prevent PVC detach issues during spot eviction.

defaultRules:
  create: true

# --- Prometheus ---
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 15d
    retentionSize: "8GB"
    #enableRemoteWriteReceiver: true

    nodeSelector:
      kubernetes.azure.com/agentpool: agentpool
    tolerations: []

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Scrape all PodMonitor and ServiceMonitor resources across all namespaces.
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    ruleNamespaceSelector: {}

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

# --- Alertmanager ---
alertmanager:
  alertmanagerSpec:
    replicas: 1
    nodeSelector:
      kubernetes.azure.com/agentpool: agentpool
    tolerations: []
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# --- Grafana ---
grafana:
  enabled: true
  replicas: 1

  nodeSelector:
    kubernetes.azure.com/agentpool: agentpool
  tolerations: []

  persistence:
    enabled: true
    size: 5Gi

  # Admin password sourced from Key Vault via ESO (Step 3).
  # Until ESO is wired, set via --set grafana.adminPassword on first install.
  adminPassword: ""   # overridden at install time by bootstrap.sh

  ingress:
    enabled: false   # enabled in Step 6

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Pre-configure Loki datasource (Loki installed separately).
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      isDefault: false

# --- Node Exporter ---
prometheus-node-exporter:
  tolerations:
    # Node exporter is a DaemonSet — must tolerate spot taint to run on all nodes.
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

# --- kube-state-metrics ---
kube-state-metrics:
  nodeSelector:
    kubernetes.azure.com/agentpool: agentpool

# --- Alertmanager config ---
alertmanager:
  alertmanagerSpec:
    replicas: 1
    nodeSelector:
      kubernetes.azure.com/agentpool: agentpool
    tolerations: []
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    secrets:
      - alertmanager-smtp-secret   # mounts the K8s secret into the pod

  config:
    global:
      smtp_smarthost: "mail.gmx.net:587"
      smtp_from: "rainer.doelker@gmx.net"
      smtp_auth_username: "rainer.doelker@gmx.net"
      smtp_require_tls: true
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp-secret/smtp_auth_password

    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: email
      routes:
        - matchers:
            - severity=~"warning|critical"
          receiver: email

    receivers:
      - name: email
        email_configs:
          - to: "rdoelker_dev_edu@gmx.net"
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ["alertname", "namespace"]

# --- Custom alert rules ---
additionalPrometheusRulesMap:
  app-alerts:
    groups:
      - name: expensy.app
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(http_errors_total{namespace=~"staging|production"}[5m]))
              / sum(rate(http_requests_total{namespace=~"staging|production"}[5m])) > 0.01
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High error rate in {{ $labels.namespace }}"
              description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

          - alert: HighP99Latency
            expr: |
              histogram_quantile(0.99,
                rate(http_request_duration_seconds_bucket{namespace=~"staging|production"}[5m])) > 0.5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High p99 latency in {{ $labels.namespace }}"
              description: "p99 latency is {{ $value | humanizeDuration }} over the last 5 minutes."

          - alert: PodRestartingFrequently
            expr: |
              increase(kube_pod_container_status_restarts_total{
                namespace=~"staging|production"}[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod restarting frequently in {{ $labels.namespace }}"
              description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in 15 minutes."

          - alert: BackendDown
            expr: |
              up{job=~"backend|backend-canary", namespace=~"staging|production"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Backend is down in {{ $labels.namespace }}"
              description: "Backend pod {{ $labels.pod }} has been unreachable for 1 minute."

# --- Grafana dashboard sidecar ---
grafana:
  enabled: true
  replicas: 1
  nodeSelector:
    kubernetes.azure.com/agentpool: agentpool
  tolerations: []
  persistence:
    enabled: true
    size: 5Gi
  adminPassword: ""
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring