---
# ClusterSecretStore — spans all namespaces.
# Consumers (staging, production) reference this store in their ExternalSecret resources.
#
# Prerequisites (handled by bootstrap.sh):
#   1. ESO managed identity created and assigned Key Vault Secrets User role
#   2. FederatedIdentityCredential created for the external-secrets-sa ServiceAccount
#   3. ESO ServiceAccount annotated with azure.workload.identity/client-id
#
# KV URI: https://kv-aks-prod-bicep-003.vault.azure.net/
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv-cluster-store
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://kv-aks-prod-bicep-003.vault.azure.net/"
      serviceAccountRef:
        name: external-secrets-sa
        namespace: external-secrets
