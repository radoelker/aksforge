apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cosmos-secret
  namespace: production
  labels:
    app.kubernetes.io/part-of: expensy
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-cluster-store
    kind: ClusterSecretStore
  target:
    name: cosmos-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: expensy
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: cosmos-mongodb-connection-string
