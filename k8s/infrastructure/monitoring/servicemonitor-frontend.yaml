apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: expensy-frontend
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - staging
      - production
  selector:
    matchLabels: {}
  endpoints:
    - port: http
      path: /api/health
      interval: 30s
      scrapeTimeout: 10s