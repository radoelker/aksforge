apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  app-dashboard.json: |
    {
      "title": "Expensy — Application",
      "uid": "expensy-app",
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=~\"staging|production\"}[2m])) by (namespace)",
              "legendFormat": "{{ namespace }}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "100 * sum(rate(http_errors_total{namespace=~\"staging|production\"}[2m])) by (namespace) / sum(rate(http_requests_total{namespace=~\"staging|production\"}[2m])) by (namespace)",
              "legendFormat": "{{ namespace }}"
            }
          ]
        },
        {
          "id": 3,
          "title": "p99 Latency (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=~\"staging|production\"}[2m])) by (le, namespace))",
              "legendFormat": "{{ namespace }}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Pod Count",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "count(kube_pod_info{namespace=~\"staging|production\"}) by (namespace)",
              "legendFormat": "{{ namespace }}"
            }
          ]
        },
        {
          "id": 5,
          "title": "MongoDB Connection Status",
          "type": "stat",
          "gridPos": { "x": 0, "y": 16, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "mongo_connection_status{namespace=\"production\"}",
              "legendFormat": "production"
            }
          ]
        },
        {
          "id": 6,
          "title": "Recent Logs — Production",
          "type": "logs",
          "gridPos": { "x": 0, "y": 20, "w": 24, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"production\"}",
              "legendFormat": ""
            }
          ],
          "datasource": { "type": "loki" }
        }
      ]
    }