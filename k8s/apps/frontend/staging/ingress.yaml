apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-staging-ingress
  # Ingress must be in the keda namespace because the interceptor proxy
  # service (keda-add-ons-http-interceptor-proxy) lives there.
  # Kubernetes Ingress backends must be in the same namespace as the Ingress.
  namespace: keda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - frontend.staging.20.85.194.20.sslip.io
      secretName: frontend-staging-tls
  rules:
    - host: frontend.staging.20.85.194.20.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keda-add-ons-http-interceptor-proxy
                port:
                  number: 8080