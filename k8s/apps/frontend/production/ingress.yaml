apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-production-ingress
  namespace: keda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - frontend.prod.azure.ironlabs.online
      secretName: frontend-prod-tls
  rules:
    - host: frontend.prod.azure.ironlabs.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keda-add-ons-http-interceptor-proxy
                port:
                  number: 8080