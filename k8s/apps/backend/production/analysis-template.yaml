apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-analysis
  namespace: production
spec:
  metrics:
  - name: error-rate
    count: 10
    failureLimit: 1
    interval: 30s
    successCondition: result < 0.01
    provider:
      prometheus:
        address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        query: |
          scalar(
            sum(rate(http_errors_total{namespace="production"}[2m]) or vector(0))
            /
            (sum(rate(http_requests_total{namespace="production"}[2m])) > 0 or vector(1))
          )
  - name: p99-latency
    count: 10
    failureLimit: 1
    interval: 30s
    successCondition: result < 0.5
    provider:
      prometheus:
        address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        query: |
          scalar(
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{namespace="production"}[2m])) by (le))
            or vector(0)
          )